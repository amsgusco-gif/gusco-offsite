<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ปฏิบัติงานนอกสถานที่ — GUSCO</title>

<!-- ===== ตั้งค่า : แก้ URL ตรงนี้ที่เดียวถ้ามีการ Deploy ใหม่ ===== -->
<script>
  var APP_URL = "https://script.google.com/macros/s/AKfycbzsfT1C4A8l-CgReKPNUY1Tz2qPfENuMNOGxarGB-5f0Syz2h7dd05FT6izuvcQvZP9xQ/exec";
</script>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b4f9e">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ปฏิบัติงานนอกสถานที่">
<meta name="mobile-web-app-capable" content="yes">

<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0b4f9e;color:#fff;text-align:center;padding:24px;
       padding-top:calc(24px + env(safe-area-inset-top));
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Sarabun,"Noto Sans Thai",sans-serif}
  .card{max-width:420px;width:100%}
  img.logo{width:120px;height:120px;border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  h1{font-size:22px;margin:18px 0 6px}
  p{margin:0 0 22px;opacity:.85;font-size:15px;line-height:1.6}
  a.btn{display:block;background:#fff;color:#0b4f9e;text-decoration:none;font-weight:700;
        padding:15px 20px;border-radius:14px;font-size:17px}
  a.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55);
              font-weight:500;font-size:15px;margin-top:12px;padding:13px 20px}
  .hint{margin-top:26px;font-size:13px;opacity:.7;line-height:1.7}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icon-512.png" alt="">
    <h1>ปฏิบัติงานนอกสถานที่</h1>
    <p>แบบฟอร์ม FMM003-08 / 09 / 10 และใบนำส่งเอกสาร</p>
    <a class="btn" id="go" href="#">เปิดแบบฟอร์ม</a>
    <a class="btn ghost" id="go2" href="#" target="_blank" rel="noopener">เปิดในแท็บใหม่ (สำหรับสั่งพิมพ์ PDF)</a>
    <div class="hint">
      ติดตั้งลงหน้าจอหลัก<br>
      iPhone / iPad : ปุ่มแชร์ → เพิ่มไปยังหน้าจอโฮม<br>
      Android : เมนู ⋮ → ติดตั้งแอป
    </div>
  </div>

<script>
  document.getElementById('go').href = APP_URL;
  document.getElementById('go2').href = APP_URL;

  // เปิดจากไอคอนหน้าจอหลัก -> พาเข้าแบบฟอร์มให้เลย ไม่ต้องกดซ้ำ
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (standalone && !sessionStorage.getItem('launched')) {
    try { sessionStorage.setItem('launched', '1'); } catch (e) {}
    setTimeout(function () { location.replace(APP_URL); }, 400);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
